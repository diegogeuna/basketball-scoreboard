<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css" />
    <title>Solo Project: Basketball Scoreboard</title>
</head>
<body>
    <div class="scoreboard-container">
        <div>
            <h1 class="score-name">HOME</h1>
            <span id="home-score" class="score-points">0</span>
            <div class="points-btns">
                <button id="home-adds-one">+1</button>
                <button id="home-adds-two">+2</button>
                <button id="home-adds-tree">+3</button>
            </div>
        </div>
        <div>
            <h1 class="score-name">GUEST</h1>
            <span id="guest-score" class="score-points">0</span>
            <div class="points-btns">
                <button id="guest-adds-one">+1</button>
                <button id="guest-adds-two">+2</button>
                <button id="guest-adds-tree">+3</button>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
