<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css" />
    <title>Solo Project: Basketball Scoreboard</title>
</head>
<body>
    <div class="scoreboard-container">
        <div>
            <h1>HOME</h1>
            <p class="home-score">0</p>
            <div class="points-buttons">
                <button id="home-adds-one">+1</button>
                <button id="home-adds-two">+2</button>
                <button id="home-adds-tree">+3</button>
            </div>
        </div>
        <div>
            <h1>GUEST</h1>
            <p class="guess-score">0</p>
            <div class="points-buttons">
                <button id="guess-adds-one">+1</button>
                <button id="guess-adds-two">+2</button>
                <button id="guess-adds-tree">+3</button>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
